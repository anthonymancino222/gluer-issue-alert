<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#06161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gluer Alert">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Gluer Issue Alert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Gluer Issue Alert v5 — visual layer, built from scratch.
   Design language: calm teal glass panel, tinted-glass tiles,
   one icon-chip + label pattern on every big button.
   Everything is sized from --vu so it scales to any screen.
   ============================================================ */
:root{
  --vu:min(1vh,1.8vw);
  --g:calc(var(--vu)*1.7);
  --pb:calc(var(--vu)*6.6);
  --ink:#f4fcfb; --ink2:#a9d4d1; --ink3:#6f9d9a;
  --es:#ffe8b8; --my:#aaf1ea; --en:#d6eeec;
  --surf:rgba(255,255,255,.07); --surf2:rgba(255,255,255,.12); --hair:rgba(255,255,255,.15);
  --red:#ff5a5f; --amber:#ffbb33; --blue:#4a8dff; --green:#2fd27c; --orange:#ff8f3a;
  --r2:calc(var(--vu)*2.6); --r3:calc(var(--vu)*3.4);
  --shadow:0 calc(var(--vu)*1) calc(var(--vu)*2.4) rgba(0,0,0,.34);
  --hi:inset 0 1px 0 rgba(255,255,255,.22);
}
@supports (height:1dvh){:root{--vu:min(1dvh,1.8vw)}}
@media (pointer:coarse){:root{--pb:calc(var(--vu)*7 + env(safe-area-inset-bottom,0px))}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
html,body{margin:0;height:100%;overflow:hidden;background:#05141a;color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Myanmar","Myanmar Text","Padauk",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}

#app{display:flex;flex-direction:column;gap:var(--g);margin:var(--vu);height:calc(100vh - var(--vu)*2);height:calc(100dvh - var(--vu)*2);
  padding:var(--g) var(--g) var(--pb);border-radius:calc(var(--vu)*4.4);
  background:
    radial-gradient(90% 50% at 14% 0%,rgba(63,190,186,.50),transparent 62%),
    radial-gradient(70% 55% at 100% 100%,rgba(33,128,134,.46),transparent 65%),
    linear-gradient(180deg,#14454b 0%,#0d2f35 52%,#081d22 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.10),0 calc(var(--vu)*1.5) calc(var(--vu)*4) rgba(0,0,0,.55)}
#app > *{min-width:0}

/* ---------- three-language text: Spanish + Burmese lead, English supports ---------- */
.lg{--u:calc(var(--vu)*3.2);display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:calc(var(--u)*.12);line-height:1.22;min-width:0;max-width:100%}
.lg.c{align-items:center;text-align:center}
.lg .es,.lg .my{font-weight:760;overflow-wrap:anywhere}
.lg .es{font-size:calc(var(--u)*1.28)}
.lg .my{font-size:calc(var(--u)*1.2)}
.lg .es{color:var(--es)}
.lg .my{color:var(--my);line-height:1.5}
.lg .en{font-style:normal;font-weight:650;font-size:calc(var(--u)*.84);color:var(--en);line-height:1.25;margin-top:calc(var(--u)*.06)}
.lg.xl{--u:calc(var(--vu)*4.4)}
.lg.md{--u:calc(var(--vu)*2.9)}
.lg.sm{--u:calc(var(--vu)*2.3)}
.lg.xs{--u:calc(var(--vu)*1.8)}
.lg.inline{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:0 calc(var(--vu)*1.2);--u:calc(var(--vu)*2.5)}
.lg.inline.c{justify-content:center}

/* ---------- glass surface ---------- */
.card{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid var(--hair);border-radius:var(--r2);box-shadow:var(--shadow),var(--hi)}

/* ---------- frosted pill buttons (back, cancel, log, update…) ---------- */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--vu)*1);min-height:calc(var(--vu)*7.4);padding:0 calc(var(--vu)*2.4);border-radius:99px;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);box-shadow:var(--shadow),var(--hi);color:#fff;font-weight:760;white-space:nowrap;transition:transform .08s ease,background .08s}
.pill:active{transform:translateY(calc(var(--vu)*.35));background:rgba(255,255,255,.22)}
.pill .ico{width:calc(var(--vu)*3);height:calc(var(--vu)*3);flex:none}
.pill.teal{background:linear-gradient(150deg,#4ccbc6,#1d8288);border-color:rgba(255,255,255,.34)}
.pill.ghost{background:transparent;box-shadow:none}

/* ---------- top bar (status light, log, update) ---------- */
.top{flex:none;display:flex;align-items:center;gap:calc(var(--vu)*2);padding:calc(var(--vu)*1.6) calc(var(--vu)*2.4)}
.lamps{display:flex;gap:calc(var(--vu)*1.1)}
.lamp{width:calc(var(--vu)*5);height:calc(var(--vu)*5);border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.22);transition:.2s}
.lamp.r.on{background:var(--red);border-color:#ffb0b0;box-shadow:0 0 28px 6px rgba(255,90,95,.6)}
.lamp.y.on{background:var(--amber);border-color:#ffe08a;box-shadow:0 0 28px 6px rgba(255,187,51,.55)}
.lamp.b.on{background:var(--blue);border-color:#b4d0ff;box-shadow:0 0 28px 6px rgba(74,141,255,.6)}
.lamp.g.on{background:var(--green);border-color:#a8f5cb;box-shadow:0 0 28px 6px rgba(47,210,124,.5)}
.lamp.pulse{animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.35}}
.lamp.cop.r.on{animation:copR .6s steps(1) infinite}
.lamp.cop.b.on{animation:copB .6s steps(1) infinite}
@keyframes copR{0%{opacity:1}50%{opacity:.12}}
@keyframes copB{0%{opacity:.12}50%{opacity:1}}
.top.cop{animation:copTop .6s steps(1) infinite}
@keyframes copTop{0%{border-color:var(--red);box-shadow:0 0 30px 4px rgba(255,90,95,.65)}50%{border-color:var(--blue);box-shadow:0 0 30px 4px rgba(74,141,255,.75)}}
.status{flex:1;min-width:0}
.status .cnt{font-size:calc(var(--vu)*2.6);color:#ff5a5f;font-weight:900;letter-spacing:.02em;line-height:1.1}
.status .cnt b{font-size:calc(var(--vu)*4.6);font-weight:900;line-height:1}

/* ---------- home ---------- */
.home{flex:1;min-height:0;display:grid;gap:var(--g);grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.home:not(.has-open){grid-template-rows:minmax(0,1fr)}
.issues{display:flex;flex-direction:column;gap:calc(var(--vu)*1.2);min-height:0}
.igbox{flex:1;min-height:0;container-type:size}
.sec{flex:none;padding:0 calc(var(--vu)*.8)}
.sec .lg{--u:calc(var(--vu)*2.1)}
.sec .lg .es,.sec .lg .my{font-weight:700}
@media (max-height:720px){.sec{display:none}}
/* six equal squares, centred: 2 x 3 on tall screens, 3 x 2 on wide ones */
.igrid{--D:min(calc((100cqw - var(--g))/2),calc((100cqh - 2*var(--g))/3));--c:calc((var(--D) - var(--g))/2);
  width:100%;height:100%;display:grid;gap:var(--g);justify-content:center;align-content:start;
  grid-template-columns:repeat(4,var(--c));grid-template-rows:repeat(3,var(--D))}
.igrid .cell{grid-column:span 2}
@container (min-aspect-ratio:1/1){
  .igrid{--D:min(calc((100cqw - 2*var(--g))/3),calc((100cqh - var(--g))/2));--c:calc((var(--D) - var(--g))/2);
    grid-template-columns:repeat(6,var(--c));grid-template-rows:repeat(2,var(--D))}
}
.cell{container-type:size;display:grid;place-items:center;min-width:0;min-height:0}
@media (orientation:landscape) and (min-width:800px){
  .home.has-open{grid-template-columns:minmax(0,3fr) minmax(0,2fr);grid-template-rows:minmax(0,1fr)}
  .openwrap{order:0!important;max-height:none!important}
}
.openwrap{order:-1;overflow-y:auto;min-height:0;max-height:38dvh;scrollbar-width:thin}
.openwrap h2{margin:0 calc(var(--vu)*.6) calc(var(--vu)*1);font-size:calc(var(--vu)*1.8);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
@media (orientation:portrait) and (min-height:721px){.openwrap{max-height:44dvh}}
@media (orientation:portrait){.openwrap h2{display:none}}

/* ---------- big buttons: one pattern — icon chip + label ---------- */
.bb{position:relative;display:flex;width:100%;height:100%;border-radius:calc(var(--vu)*3.4);text-align:left;overflow:hidden;color:#fff;
  background:linear-gradient(155deg,var(--b1,rgba(255,255,255,.13)),var(--b2,rgba(255,255,255,.05)));
  border:1px solid var(--bd,rgba(255,255,255,.2));
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.30),inset 0 calc(var(--vu)*-1) calc(var(--vu)*2) rgba(0,0,0,.14);
  transition:transform .08s ease,box-shadow .08s ease,filter .08s ease}
.bb:active{transform:translateY(calc(var(--vu)*.4)) scale(.985);filter:brightness(1.1)}
.bi{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;width:100%;height:100%;padding:calc(min(100cqw,100cqh)*.085)}
.chip{flex:none;width:calc(min(100cqw,100cqh)*.24);aspect-ratio:1;border-radius:30%;display:grid;place-items:center;background:var(--chip,rgba(255,255,255,.18));box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 calc(var(--vu)*.5) calc(var(--vu)*1.2) rgba(0,0,0,.22)}
.chip .ico{width:62%;height:62%}
.chip .ico,.chip .ico [stroke]{stroke:#fff}
.chip .ico [stroke*="ia"]{stroke:#ffeaa8}
.chip .ico circle{fill:#ffeaa8}
.bb .lg{--u:calc(min(100cqw,100cqh)*var(--ku,.078));max-width:100%}
/* wide + short cells: icon left, label right */
@container (min-aspect-ratio:1.55/1){
  .bi.adapt{flex-direction:row;align-items:center;justify-content:flex-start;gap:calc(min(100cqw,100cqh)*.16);padding:calc(min(100cqw,100cqh)*.11) calc(min(100cqw,100cqh)*.14)}
  .bi.adapt .chip{width:calc(min(100cqw,100cqh)*.5)}
  .bi.adapt .lg{--u:min(calc(var(--kw,5.2)*1cqw),calc(var(--kh,17)*1cqh))}
}
.bb.sq .bi{padding:calc(min(100cqw,100cqh)*.085)}
.tile{width:min(100cqw,100cqh);height:min(100cqw,100cqh)}

/* issue colours: tinted glass */
.c-fold{--b1:rgba(160,132,250,.42);--b2:rgba(80,58,180,.28);--bd:rgba(190,170,255,.5);--chip:linear-gradient(150deg,#ac92ff,#5b42c6)}
.c-glue{--b1:rgba(246,118,176,.42);--b2:rgba(160,48,108,.28);--bd:rgba(255,168,208,.5);--chip:linear-gradient(150deg,#ff82ba,#b03471)}
.c-crack{--b1:rgba(54,210,196,.40);--b2:rgba(22,122,120,.28);--bd:rgba(130,240,228,.5);--chip:linear-gradient(150deg,#40d9ca,#177d7b)}
.c-burst{--b1:rgba(230,170,112,.42);--b2:rgba(138,92,48,.30);--bd:rgba(246,200,150,.5);--chip:linear-gradient(150deg,#eab07a,#935f30)}
.c-scuff{--b1:rgba(88,196,238,.40);--b2:rgba(24,110,150,.28);--bd:rgba(150,225,250,.5);--chip:linear-gradient(150deg,#63cdf2,#1b7aa6)}
.c-other{--b1:rgba(150,170,200,.38);--b2:rgba(74,92,122,.30);--bd:rgba(190,206,230,.45);--chip:linear-gradient(150deg,#9db1cf,#4e6283)}
/* action colours: filled */
.f-green{--b1:#34d683;--b2:#12905a;--bd:rgba(255,255,255,.38);--es:#fff;--my:#fff;--en:rgba(255,255,255,.92)}
.f-orange{--b1:#ff9d4a;--b2:#d0640f;--bd:rgba(255,255,255,.38);--es:#fff;--my:#fff;--en:rgba(255,255,255,.92)}
.f-red{--b1:#ff6c70;--b2:#c2323a;--bd:rgba(255,255,255,.38);--es:#fff;--my:#fff;--en:rgba(255,255,255,.92)}
.f-blue{--b1:#5c9dff;--b2:#2961d8;--bd:rgba(255,255,255,.38);--es:#fff;--my:#fff;--en:rgba(255,255,255,.92)}
.f-green,.f-orange,.f-red,.f-blue{--chip:rgba(255,255,255,.22)}
/* neutral teal glass (reasons) and the amber highlight for a chosen one */
.g-teal{--b1:rgba(60,200,192,.34);--b2:rgba(28,110,116,.30);--bd:rgba(150,238,230,.38)}
.sel{--b1:#ffd45a;--b2:#e0a300;--bd:#fff3c6;--es:#3a2a00;--my:#3a2a00;--en:#3a2a00;--chip:rgba(58,42,0,.16)}
.sel .chip .ico,.sel .chip .ico [stroke],.sel .chip .ico [stroke*="ia"]{stroke:#3a2a00}
.sel .chip .ico circle{fill:#3a2a00}
.dim{opacity:.72}

/* ---------- open-issue cards ---------- */
.ocard{position:relative;display:block;width:100%;text-align:left;margin-bottom:var(--g);overflow:hidden;container-type:inline-size;padding:0}
.ocard:last-child{margin-bottom:0}
.ocard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--vu)*1.6);background:var(--ac,rgba(255,255,255,.3))}
.ocard.red{--ac:var(--red);background:linear-gradient(160deg,rgba(238,86,86,.46),rgba(150,40,60,.32));border-color:rgba(255,135,135,.7)}
.ocard.yellow{--ac:var(--amber);background:linear-gradient(160deg,rgba(255,206,64,.40),rgba(160,120,10,.28));border-color:rgba(255,218,110,.7)}
.ocard.blue{--ac:var(--blue);background:linear-gradient(160deg,rgba(84,156,255,.46),rgba(30,90,200,.32));border-color:rgba(140,196,255,.7)}
.ocard.cop{--ac:var(--red);animation:copCard .6s steps(1) infinite}
@keyframes copCard{0%{border-color:var(--red);background:rgba(120,30,40,.7);--ac:var(--red)}50%{border-color:var(--blue);background:rgba(20,50,120,.7);--ac:var(--blue)}}
.ocard.flash{animation:flash 1s infinite}
.ocard.flashb{animation:flashb 1s infinite}
@keyframes flash{50%{background:rgba(120,30,40,.7)}}
@keyframes flashb{50%{background:rgba(20,50,120,.7)}}
.oi{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n t" "w m" "c c";align-items:center;column-gap:calc(var(--vu)*1.6);row-gap:calc(var(--vu)*1);padding:calc(var(--vu)*1.5) calc(var(--vu)*2) calc(var(--vu)*1.5) calc(var(--vu)*4)}
.oi .r1,.oi .r2{display:contents}
.oi .r1 .lg{grid-area:n}
.oi .el{grid-area:t}
.oi .who{grid-area:w;justify-self:start}
.oi .r3{grid-area:m;display:flex;align-items:center;gap:calc(var(--vu)*1.1);justify-self:end}
.oi .cf{grid-area:c;display:flex;align-items:center;gap:calc(var(--vu)*.8);font-size:calc(var(--vu)*2.1);font-weight:800;color:#ffb066}
.oi .cf .ico{width:1.15em;height:1.15em}
.el{text-align:right;white-space:nowrap;font-weight:900;color:#ff6a6e;font-variant-numeric:tabular-nums;line-height:1.05}
.el small{display:block;font-size:.34em;font-weight:800;color:#b9dcd9;letter-spacing:.02em;margin-bottom:.15em}
.oi .el{font-size:calc(var(--vu)*3.4)}
.u{display:inline-block;font-size:calc(var(--vu)*1.7);font-weight:800;border-radius:99px;padding:calc(var(--vu)*.3) calc(var(--vu)*1.3);color:#10131a}
.u.red{background:var(--red);color:#fff}
.u.yellow{background:var(--amber)}
.u.retry{display:inline-flex;align-items:center;gap:.3em;background:var(--orange);color:#2a1300}
.u.retry .ico{width:1.1em;height:1.1em}
.st{display:inline-flex}
.st .ico{width:calc(var(--vu)*3.4);height:calc(var(--vu)*3.4)}
.s-siren{color:var(--red)} .s-wrench{color:#7fb4ff} .s-check{color:var(--green)} .s-clock{color:var(--amber)}
.who{display:inline-flex;flex-wrap:wrap;align-items:center;column-gap:.55em;row-gap:calc(var(--vu)*.25);border-radius:calc(var(--vu)*2.2);padding:calc(var(--vu)*.9) calc(var(--vu)*2);font-weight:900;font-size:calc(var(--vu)*2.1);line-height:1.45;max-width:100%}
.who .wt{display:contents}
.who .wt span{line-height:1.55}
.who small{font-size:.8em;font-weight:800;opacity:.9;line-height:1.4}
.who .ico{width:1.15em;height:1.15em}
.who.op{background:#fff;color:#10222a}
.who.pk{background:var(--blue);color:#fff}
.who.qa{background:linear-gradient(90deg,var(--red),var(--blue));color:#fff}
@container (max-width:460px){
  .oi .lg.inline{--u:calc(var(--vu)*1.9)}
  .oi .el{font-size:calc(var(--vu)*2.6)}
  .oi{padding:calc(var(--vu)*1.1) calc(var(--vu)*1.4) calc(var(--vu)*1.1) calc(var(--vu)*4);row-gap:calc(var(--vu)*.5)}
  .who{font-size:calc(var(--vu)*1.6)}
  .who .ico{display:none}
  .u{font-size:calc(var(--vu)*1.4)}
}
@media (orientation:portrait){
  .oi .lg.inline{--u:calc(var(--vu)*2)}
  .oi .el{font-size:calc(var(--vu)*2.8)}
  .oi{padding:calc(var(--vu)*1.1) calc(var(--vu)*1.6) calc(var(--vu)*1.1) calc(var(--vu)*4);row-gap:calc(var(--vu)*.5)}
  .who{font-size:calc(var(--vu)*1.7)}
  .u{font-size:calc(var(--vu)*1.5)}
}

/* ---------- sub-screens ---------- */
.head{flex:none;display:flex;align-items:center;gap:calc(var(--vu)*1.6)}
.head .sp{flex:1}
.head .title{font-size:calc(var(--vu)*4);font-weight:900}
.head .title .vtag{font-size:calc(var(--vu)*2);font-weight:700;color:var(--ink2);margin-left:calc(var(--vu)*1)}
.sent{display:inline-flex;align-items:center;gap:calc(var(--vu)*1);font-weight:900;color:#ff6a6e;font-size:calc(var(--vu)*3.6);font-variant-numeric:tabular-nums;white-space:nowrap}
.sent .ico{width:calc(var(--vu)*3.2);height:calc(var(--vu)*3.2);color:#ffb3b5}

.sumc{flex:none;display:flex;align-items:center;gap:calc(var(--vu)*2.2);padding:calc(var(--vu)*1.8) calc(var(--vu)*2.4)}
.sumc .chip{width:calc(var(--vu)*9);aspect-ratio:1;border-radius:30%}
.sumc .grow{flex:1;min-width:0}

/* urgency choice */
.opts{flex:1 1 0;min-height:0;container-type:size}
.og{width:100%;height:100%;display:grid;gap:var(--g);grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
@container (max-aspect-ratio:1.1/1){.og{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr))}}
.o-red{--b1:rgba(255,92,96,.36);--b2:rgba(170,40,56,.28);--bd:rgba(255,150,152,.55);--chip:linear-gradient(150deg,#ff7a7e,#c3343b)}
.o-yellow{--b1:rgba(255,196,60,.34);--b2:rgba(170,120,10,.26);--bd:rgba(255,222,120,.55);--chip:linear-gradient(150deg,#ffcf55,#cf8f00)}
.o-red.sel{--b1:#ff6c70;--b2:#c2323a;--bd:#fff;--es:#fff;--my:#fff;--en:rgba(255,255,255,.92);--chip:rgba(255,255,255,.24)}
.o-red.sel .chip .ico,.o-red.sel .chip .ico [stroke]{stroke:#fff}
.o-red.sel .chip .ico [stroke*="ia"]{stroke:#ffeaa8}
.rd{position:absolute;top:calc(min(100cqw,100cqh)*.09);right:calc(min(100cqw,100cqh)*.09);width:calc(min(100cqw,100cqh)*.1);aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.7);display:grid;place-items:center;color:#fff}
.sel .rd{background:#fff;border-color:#fff;color:#2a2a2a}
.rd .ico{width:68%;height:68%}
.cta{flex:none;position:relative;width:100%;height:max(calc(var(--vu)*11),84px);border-radius:calc(var(--vu)*3.4);display:flex;align-items:center;justify-content:center;gap:calc(var(--vu)*2);color:#fff;
  background:linear-gradient(155deg,var(--b1),var(--b2));border:1px solid rgba(255,255,255,.38);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.32),inset 0 calc(var(--vu)*-1) calc(var(--vu)*2) rgba(0,0,0,.14);transition:transform .08s ease,filter .08s ease}
.cta:active{transform:translateY(calc(var(--vu)*.4)) scale(.99);filter:brightness(1.1)}
.cta .ico{width:calc(var(--vu)*4);height:calc(var(--vu)*4)}
.cta .ico,.cta .ico [stroke]{stroke:#fff}
.cta .lg{--u:calc(var(--vu)*3.2)}

  const open = issues.filter(isOpen);

  if (open.some(i => !i.ackAt && i.color === 'red')) return 'red';
  if (open.some(i => !i.ackAt)) return 'yellow';
  if (open.length) return 'blue';
  return 'green';
}

}

const WHO = {op:['OPERATOR','OPERADOR','အော်ပရေတာ'], pk:['PACKERS','EMPACADORES','ထုပ်ပိုးသူများ'], qa:['QA / MANAGER','QA / GERENTE','QA / မန်နေဂျာ']};
const whoTag = i => { const k = isEsc(i) ? 'qa' : (i.opResolvedAt || i.cantFixAt) ? 'pk' : 'op'; const w = WHO[k]; return `<span class="who ${k}">${ico('arrow','cc')}<span class="wt"><span>${pk(w)}</span></span>${lang==='en'?'':`<small>${w[0]}</small>`}</span>`; };
const statusEmoji = i => { const k = isEsc(i) ? ['siren','siren'] : (i.opResolvedAt || i.cantFixAt) ? ['checkc','check'] : i.ackAt ? ['wrench','wrench'] : ['clock','clock']; return ico(k[0],'cc s-'+k[1]); };

function renderHome(){
  if (myRole === 'operator') return renderOpHome();
  const open = issues.filter(isOpen).sort((a,b) => (a.color===b.color ? a.submittedAt-b.submittedAt : a.color==='red'?-1:1));
  const tiles = Object.keys(TYPES).map(k => `
    <div class="cell ${k==='other'?'other':''}"><button class="bb tile sq c-${k}" data-act="pick" data-type="${k}"><span class="bi"><span class="chip">${ico(TYPES[k].ic)}</span>${lg(TYPES[k].t)}</span></button></div>`).join('');
  const cards = open.map(i => `
    <button class="card ocard ${cardColor(i)} ${i.color==='red'&&!i.ackAt?'flash':''} ${(i.opResolvedAt||(i.cantFixAt&&!isEsc(i)))?'flashb':''}" data-act="open" data-id="${i.id}">
      <div class="oi">
        <div class="r1">${lg(TYPES[i.type].t,'inline')}<div class="el"><small>${L2(T.sent)}</small>${fmtHM(i.submittedAt)}</div></div>
        <div class="r2">${whoTag(i)}</div>
        <div class="r3"><span class="u ${i.color}">${URG[i.color].en}</span><span class="st">${statusEmoji(i)}</span>${(i.attempts&&i.attempts.length)?`<span class="u retry">${ico('undo','cc')}${i.attempts.length+1}</span>`:''}</div>
        ${i.cantFixAt&&!i.opResolvedAt?`<div class="cf">${ico('warn','cc')} ${pk(T.cant)} · ${cfTextL(i)}</div>`:''}
      </div>
    </button>`).join('');
  const side = open.length ? `<div class="openwrap"><h2>${L2(['Open','Abiertos','ဖွင့်ထားသည်'])}</h2>${cards}</div>` : '';
  return `${topbar()}${pkBanner()}
    <div class="home ${open.length?'has-open':''}">
      <div class="issues"><div class="sec">${lg(['Report a quality issue','Reportar un problema de calidad','အရည်အသွေး ပြဿနာ တင်ပြရန်'],'inline')}</div><div class="igbox"><div class="igrid">${tiles}</div></div></div>${side}
    </div>`;
}

const backBtn = (act='home', id='', en=false) => `<button class="pill" data-act="${act}" ${id?`data-id="${id}"`:''}>${ico('chev','cc')}<span class="tx">${en?'Back':lg(T.back,'inline')}</span></button>`;

function renderColor(){
  const t = view.type, sel = view.color;
  const opt = (c, icon) => `<div class="cell"><button class="bb opt o-${c} ${sel===c?'sel':''} ${sel&&sel!==c?'dim':''}" data-act="color" data-color="${c}"><span class="bi adapt"><span class="chip">${ico(icon)}</span>${lg(URG[c].d)}</span><span class="rd">${sel===c?ico('check','cc'):''}</span></button></div>`;
  return `<div class="head">${backBtn()}</div>
    <div class="card sumc"><span class="chip c-${t}">${ico(TYPES[t].ic)}</span><div class="grow">${lg(TYPES[t].t,'xl')}</div></div>
    <div class="opts"><div class="og">${opt('red','siren')}${opt('yellow','clock')}</div></div>
    <button class="cta f-blue" data-act="send" ${sel?'':'disabled'} style="--b1:#5c9dff;--b2:#2961d8">${ico('arrow')}${lg(T.send,'inline c')}</button>`;
}

function renderCant(){
  const i = byId(view.id); if (!i) return renderHome();
  const r = view.reason;
  const rt = k => `<div class="cell"><button class="bb g-teal ${r===k?'sel':''} ${r&&r!==k?'dim':''}" data-act="reason" data-r="${k}"><span class="bi adapt"><span class="chip">${ico(REASONS[k].ic)}</span>${lg(REASONS[k].t)}</span></button></div>`;
  const note = r === 'other' ? `<textarea id="note" placeholder="${L2(T.typeit)}">${view.note||''}</textarea>` : '';
  return `<div class="head">${backBtn('open', i.id)}</div>
    <div class="card whycard">${lg(T.why,'md')}<div class="sub">${TYPES[i.type].t[0]}</div></div>
    <div class="reasons"><div class="rg">${rt('die')}${rt('paper')}${rt('cad')}${rt('other')}</div></div>
    ${note}
    <button class="cta" data-act="sendcant" ${r?'':'disabled'} style="--b1:#ff9d4a;--b2:#d0640f">${ico('check')}${lg(T.confirm,'inline c')}</button>`;
}

function stepper(i){
  const pathB = i.cantFixAt || i.escalatedAt || i.qaAt;
  const S = pathB
    ? [['sent',i.submittedAt,'arrow',['Sent','Enviado','ပို့ပြီး']],['ack',i.ackAt,'wrench',['Operator','Operador','အော်ပရေတာ']],['esc',i.escalatedAt,'siren',['Escalated','Escalado','တင်ပြပြီး']],['qa',i.qaAt,'checkc',['QA','QA','QA']]]
    : [['sent',i.submittedAt,'arrow',['Sent','Enviado','ပို့ပြီး']],['ack',i.ackAt,'wrench',['Operator','Operador','အော်ပရေတာ']],['opf',i.opResolvedAt,'check',['Fixed','Arreglado','ပြင်ပြီး']],['pk',i.resolvedAt,'checkc',['Packers','Empacadores','ထုပ်ပိုးသူ']]];
  let cur = S.findIndex(x => !x[1]); if (cur < 0) cur = S.length - 1;
  return `<div class="stp">${S.map((x,idx) => `<div class="step ${x[1]?'done':''} ${idx===cur&&!x[1]?'cur':''} ${x[0]==='esc'?'esc':''}"><span class="dot">${ico(x[2],'cc')}</span><span class="lab">${pk(x[3])}${lang==='en'?'':`<br>${x[3][0]}`}</span><span class="tm">${x[1]?fmtHM(x[1]):'—'}</span></div>`).join('')}</div>`;
}

function renderDetail(){
  const i = byId(view.id);
  if (!i) return renderHome();
  const done = !!(i.resolvedAt || i.qaAt), cancelled = !!i.cancelledAt, esc = isEsc(i);
  const row = (k, ts, extra='', cfRow=false) => `<div class="trow ${ts?'done':''} ${cfRow?'cf':''}"><span class="dotc"></span>
      <div class="lbl">${lg(TS[k],'inline')}${extra}</div>
      <div class="tm ${ts?'':'none'}">${fmtTime(ts)}</div></div>`;
  let action = '';
  if (!cancelled && !done){
    const stage = esc ? 'qa' : !i.ackAt ? 0 : i.opResolvedAt ? 2 : i.cantFixAt ? 'cf' : 1;
    const tk = stage === 'qa' ? 'turnqa' : stage === 'cf' ? 'turncf' : 'turn'+stage;
    const btn = (cls, icon, act, label, extra='') => `<div class="cell"><button class="bb abtn ${cls}" data-act="${act}" data-id="${i.id}" ${extra}><span class="bi adapt"><span class="chip">${ico(icon)}</span>${lg(label)}</span></button></div>`;
    const acts = (n, inner) => `<div class="acts"><div class="actg n${n}">${inner}</div></div>`;
    const tn = stage === 'qa' ? 'qa' : (stage === 0 || stage === 1) ? 'op' : 'pk';
    const mineT = tn === 'qa' || myRole === 'both' || (tn === 'op' && myRole === 'operator') || (tn === 'pk' && myRole === 'packer');
    action = !mineT ? `<div class="turn wait">${ico('clock','cc')}${lg(tn === 'op' ? T.waitop : T.waitpk,'md')}</div>` : `<div class="turn">${ico('arrow','cc')}${lg(T[tk],'md')}</div>` + (stage === 'qa'
      ? acts(2, btn('f-green','checkc','askqa',T.approved,'data-d="approved"') + btn('f-red','x','askqa',T.notapproved,'data-d="rejected"'))
      : stage === 'cf'
      ? acts(1, btn('f-orange','siren','askesc',T.escal)) + `<button class="pill retry" data-act="retry" data-id="${i.id}">${ico('undo','cc')}${L2(T.retry)}</button>`
      : stage === 0
      ? acts(1, btn('f-blue','check','ack',T.confirm))
      : stage === 1
      ? acts(2, btn('f-green','checkc','askop',T.fixed) + btn('f-orange','warn','cantfix',T.cant))
      : acts(2, btn('f-green','checkc','askres',T.pconfirm) + btn('f-red','x','asknot',T.notfixed)));
  }
  const tags = [];
  if (cancelled) tags.push(`<span class="tag">${L2(['Cancelled','Cancelado','ပယ်ဖျက်ပြီး'])}</span>`);
  else if (i.qaAt) tags.push(`<span class="tag ${i.qaDecision==='approved'?'green':'red'}">QA: ${L2(T[i.qaDecision==='approved'?'approved':'notapproved'])}</span>`);
  else if (done) tags.push(`<span class="tag green">${ico('checkc','cc')}${L2(['Resolved','Resuelto','ဖြေရှင်းပြီး'])}</span>`);
  else {
    tags.push(`<span class="tag ${i.color}">${URG[i.color].en} · ${L2(URG[i.color].tag)}</span>`);
    if (esc) tags.push(`<span class="tag cop">${ico('siren','cc')}${pk(T.escwait)}</span>`);
    else if (i.cantFixAt && !i.opResolvedAt) tags.push(`<span class="tag orange">${ico('warn','cc')}${pk(T.cant)} · ${i.cantFixReason?pk(REASONS[i.cantFixReason].t):''}</span>`);
  }
  const cfRow = i.cantFixAt ? row('cantfixed', i.cantFixAt, `<div class="why">${cfTextL(i)}</div>`, true) : '';
  const rows = row('sent', i.submittedAt) + row('ack', i.ackAt)
    + ((i.attempts&&i.attempts.length) ? row('rejected', i.attempts[i.attempts.length-1].at, `<div class="why">×${i.attempts.length}</div>`, true) : '')
    + cfRow
    + (i.escalatedAt||i.qaAt ? row('escalated', i.escalatedAt) + row('qa', i.qaAt, i.qaAt?`<div class="why ${i.qaDecision==='approved'?'qa-ok':'qa-no'}">${pk(T[i.qaDecision==='approved'?'approved':'notapproved'])}</div>`:'') : row('opfixed', i.opResolvedAt) + row('resolved', i.resolvedAt));
  return `<div class="head">${backBtn()}<span class="sp"></span>${!cancelled&&!done?`${myRole==='operator'?'':`<button class="pill ghost" data-act="askcancel" data-id="${i.id}">${ico('x','cc')}<span class="tx">Cancel</span></button>`}<div class="el" style="font-size:calc(var(--vu)*4)"><small>${L2(T.sent)}</small>${fmtHM(i.submittedAt)}</div>`:''}</div>
    <div class="dgrid">
      <div class="card sumcard ${(!cancelled&&!done&&i.color==='red'&&!i.ackAt)?'flash':''} ${esc?'cop':''}">
        <div class="sumtop"><span class="chip c-${i.type}">${ico(TYPES[i.type].ic)}</span><div class="grow">${lg(TYPES[i.type].t,'xl')}<div class="badges">${tags.join('')}</div></div></div>
        ${cancelled?'':stepper(i)}
      </div>
      <div class="dr">${action}</div>
      <div class="card tl ${view.tl?'open':''}"><button class="tlh" data-act="tl" aria-expanded="${!!view.tl}">${ico('log','cc')}<span class="grow">${lg(['History','Historial','မှတ်တမ်း'],'inline')}</span>${ico(view.tl?'chevu':'chevd','cc')}</button><div class="tlb">${rows}</div></div>
    </div>`;
}

    ${lightCard()}
    <div class="card kcard">
      <div class="khead">${lg(['Keyboard shortcuts','Atajos de teclado','ကီးဘုတ် ဖြတ်လမ်းများ'],'inline')}</div>
      <div class="ktip"><p>${pk(['Using a computer? Press “Set key” next to a button, then press the key you want. Pressing that key later does the same as tapping the button. Keys are ignored while you are typing in a box, and are saved on this computer only.'].concat(TRK.tip))}</p>${lang==='en'?'':`<p class="ken">Using a computer? Press “Set key” next to a button, then press the key you want. Pressing that key later does the same as tapping the button. Keys are ignored while you are typing in a box, and are saved on this computer only.</p>`}</div>
      <div class="kbar">
        <button class="pill ${st.on?'teal':''}" data-act="kbtoggle">${bx('Keyboard: ' + (st.on?'ON':'OFF'), tp('Keyboard') + ': ' + tp(st.on?'ON':'OFF'))}</button>
        <button class="pill ${st.hints?'teal':''}" data-act="kbhints">${bx('Show keys on buttons: ' + (st.hints?'ON':'OFF'), tp('Show keys on buttons') + ': ' + tp(st.hints?'ON':'OFF'))}</button>
        <button class="pill" data-act="kbsuggest">${bi('Use suggested keys')}</button>
        <button class="pill ghost" data-act="kbclearask">${bi('Remove all keys')}</button>
      </div>
    </div>
    ${kbHelp()}${groups}</div>`;
}

/* ---------- roles: Packers send issues, the Operator watches for them ---------- */
const turnOf = i => isEsc(i) ? 'qa' : (i.opResolvedAt || i.cantFixAt) ? 'pk' : 'op';
const ROLE_NAME = {packer:['PACKERS','EMPACADORES','ထုပ်ပိုးသူများ'], operator:['OPERATOR','OPERADOR','အော်ပရေတာ'], both:['ONE TABLET','UNA TABLET','တက်ဘလက်တစ်လုံး']};

function renderRole(){
  const cur = myRole;
  const card = (k, cls, icon, title, sub) => `<button class="rolebtn ${cls} ${cur===k?'cur':''}" data-act="role" data-r="${k}"><span class="rcard">
      <span class="rleft"><span class="rchip">${ico(icon)}</span><span class="rtit">${lg(title,'xl c')}</span></span>
      <span class="rright">${lg(sub,'md c')}</span></span></button>`;
  const lb = x => `<button class="pill ${lang===x[0]?'teal':''}" data-act="lang" data-l="${x[0]}">${x[1]}</button>`;
  return `${cur?`<div class="head">${backBtn()}</div>`:''}
    <div class="rolehead">${lg(['Who are you?','¿Quién es usted?','သင်ဘယ်သူလဲ'],'xl c')}</div>
    <div class="langrow">${LANGS.map(lb).join('')}</div>
    <div class="rolegrid">
      ${card('packer','rp','pack',ROLE_NAME.packer,['I send quality issues','Yo envío problemas de calidad','ကျွန်ုပ်က အရည်အသွေး ပြဿနာ ပို့သည်'])}
      ${card('operator','ro','wrench',ROLE_NAME.operator,['I fix the issues','Yo arreglo los problemas','ကျွန်ုပ်က ပြဿနာ ပြင်ဆင်သည်'])}
      ${card('both','rb','swap',ROLE_NAME.both,['Packers and operator share this tablet (with the alert light)','Empacadores y operador comparten esta tablet (con la luz de alerta)','ထုပ်ပိုးသူနှင့် အော်ပရေတာ ဤတက်ဘလက်ကို မျှသုံးသည် (သတိပေးမီးနှင့်)'])}
    </div>
    <div class="rolefoot"><button class="pill teal" data-act="update">${ico('refresh','cc')}<span class="tx">Update</span></button></div>`;
}

/* quiet-time summary on the operator's all-clear screen */
function opStats(){
  const d0 = new Date(); d0.setHours(0,0,0,0);
  const td = issues.filter(i => i.submittedAt >= d0.getTime());
  const done = td.filter(i => i.resolvedAt || i.qaAt).length;
  const last = [...issues].sort((a,b) => b.submittedAt - a.submittedAt)[0];
  const S = [[['Today','Hoy','ယနေ့'], td.length], [['Resolved','Resueltos','ဖြေရှင်းပြီး'], done], [['Last issue','Último problema','နောက်ဆုံး ပြဿနာ'], last ? fmtHM(last.submittedAt) : '—']];
  return `<div class="opstats">${S.map(s => `<div class="ostat"><b>${s[1]}</b>${lg(s[0],'sm c')}</div>`).join('')}</div>`;
}

/* packers: when the work comes back to them, the screen strobes blue (the operator's red alert, in blue) */
function pkBanner(){
  if (myRole !== 'packer' && myRole !== 'both') return '';
  if (myRole === 'both') {      // one shared tablet: a brand-new issue needs the operator first
    const fresh = issues.filter(i => isOpen(i) && !i.ackAt);
    if (fresh.length) {
      const red = fresh.some(i => i.color === 'red');
      return `<div class="opban ${red?'red':'yellow'}">${ico('siren','cc')}${lg(['NEW ISSUE – OPERATOR: CONFIRM NOW','NUEVO PROBLEMA – OPERADOR: CONFIRME YA','ပြဿနာအသစ် – အော်ပရေတာ အတည်ပြုပါ'],'')}<span class="num">${fresh.length}</span></div>`;
    }
  }
  const back = issues.filter(i => isOpen(i) && turnOf(i) === 'pk');
  if (!back.length) return '';
  const fixed = back.filter(i => i.opResolvedAt).length, cant = back.length - fixed;
  const t = fixed && !cant ? ['OPERATOR FIXED IT – CHECK NOW','EL OPERADOR LO ARREGLÓ – REVISEN YA','အော်ပရေတာ ပြင်ပြီး – ယခု စစ်ဆေးပါ']
    : cant && !fixed ? ["OPERATOR CAN'T FIX – DECIDE NOW",'EL OPERADOR NO PUEDE – DECIDAN YA','အော်ပရေတာ ပြင်မရ – ယခု ဆုံးဖြတ်ပါ']
    : ['PACKERS: ACTION NEEDED NOW','EMPACADORES: ACCIÓN NECESARIA YA','ထုပ်ပိုးသူများ – ယခု လုပ်ဆောင်ပါ'];
  return `<div class="opban bflash">${ico(cant && !fixed ? 'warn' : 'checkc','cc')}${lg(t,'')}<span class="num">${back.length}</span></div>`;
}

function renderOpHome(){
  const open = issues.filter(isOpen);
  const todo = open.filter(i => turnOf(i) === 'op');
  const fresh = todo.filter(i => !i.ackAt);
  const rank = i => turnOf(i) === 'op' ? (i.ackAt ? 1 : 0) : turnOf(i) === 'qa' ? 3 : 2;
  const list = [...open].sort((a,b) => rank(a) - rank(b) || (a.color === b.color ? a.submittedAt - b.submittedAt : a.color === 'red' ? -1 : 1));
  let ban;
  if (fresh.length) {
    const red = fresh.some(i => i.color === 'red');
    ban = {cls: red ? 'red' : 'yellow', icon: 'siren', n: fresh.length, t: red ? ['NEW ISSUE – GO NOW','NUEVO PROBLEMA – VAYA YA','ပြဿနာအသစ် – ယခု သွားပါ'] : ['NEW ISSUE – CHECK IT','NUEVO PROBLEMA – REVÍSELO','ပြဿနာအသစ် – စစ်ဆေးပါ']};
  } else if (todo.length) {
    ban = {cls: 'blue', icon: 'wrench', n: todo.length, t: ['YOU ARE WORKING ON IT','USTED ESTÁ TRABAJANDO EN ELLO','သင် လုပ်ဆောင်နေသည်']};
  } else if (open.length) {
    ban = {cls: 'wait', icon: 'clock', n: open.length, t: ['WAITING FOR PACKERS / QA','ESPERANDO A EMPACADORES / QA','ထုပ်ပိုးသူ / QA ကို စောင့်နေသည်']};
  }
  const act = (cls, icon, a, label, id) => `<button class="opbtn ${cls}" data-act="${a}" data-id="${id}">${ico(icon)}${lg(label,'c')}</button>`;
  const card = i => {
    const turn = turnOf(i);
    const stage1 = turn === 'op' && i.ackAt;
    const actions = turn === 'op'
      ? (stage1 ? act('f-green','checkc','askop',T.fixed,i.id) + act('f-orange','warn','cantfix',T.cant,i.id) : act('f-blue','check','ack',T.confirm,i.id))
      : '';
    return `<div class="card ocard opc ${cardColor(i)} ${fresh.includes(i) && i.color === 'red' ? 'flash' : ''}">
      <div class="opbody">
        <button class="opinfo" data-act="open" data-id="${i.id}">
          <span class="chip c-${i.type}">${ico(TYPES[i.type].ic)}</span>
          <span class="opt">${lg(TYPES[i.type].t,'md')}
            <span class="opmeta"><span class="u big ${i.color}">${URG[i.color].en}</span><span class="optime">${pk(T.sent)} · ${fmtHM(i.submittedAt)}</span>${(i.attempts&&i.attempts.length)?`<span class="u big retry">${ico('undo','cc')}${i.attempts.length+1}</span>`:''}</span>
            ${i.cantFixAt&&!i.opResolvedAt?`<span class="opcf">${ico('warn','cc')} ${pk(T.cant)} · ${cfTextL(i)}</span>`:''}
          </span>
        </button>
        <div class="opact">${actions || whoTag(i)}</div>
      </div>
    </div>`;
  };
  const body = open.length
    ? `<div class="opban ${ban.cls}">${ico(ban.icon,'cc')}${lg(ban.t,'')}<span class="num">${ban.n}</span></div><div class="oplist">${list.map(card).join('')}</div>`
    : `<div class="opok"><span class="okc">${ico('checkc','cc')}</span>${lg(T.allgood,'xl c')}<div class="oksub">${lg(['No issues need you right now','Ningún problema lo necesita ahora','ယခု သင့်အတွက် ပြဿနာ မရှိပါ'],'md c')}</div>${opStats()}</div>`;
  return `${topbar()}${body}`;
}

function renderHistory(){
  const f = view.f || {u:'all', t:'all', d:''};
  const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const match = i => (f.u === 'all' || i.color === f.u) && (f.t === 'all' || i.type === f.t) && (!f.d || dayKey(i.submittedAt) === f.d);
  const filtering = f.u !== 'all' || f.t !== 'all' || !!f.d;
  const all = [...issues].sort((a,b) => b.submittedAt - a.submittedAt);
  const list = all.filter(match);
  const card = i => {
    const resp = i.ackAt ? fmtDur(i.ackAt - i.submittedAt) : '—';
    const closeAt = i.resolvedAt || i.qaAt;
    const fix = closeAt ? fmtDur(closeAt - i.submittedAt) : '—';
    const st = i.cancelledAt ? 'Cancelled' : i.qaAt ? 'QA ' + (i.qaDecision === 'approved' ? 'Approved' : 'Not approved') : i.resolvedAt ? 'Resolved' : i.escalatedAt ? 'ESCALATED' : 'Open';
    const open = !!(view.exp && view.exp[i.id]);
    return '<div class="card hcard ' + i.color + ' ' + (open?'open':'') + '"><button class="hh" data-act="hexp" data-id="' + i.id + '"><div class="t">' + TYPES[i.type].t[0] + '<span>' + i.color.toUpperCase() + ' · ' + st + ' · ' + fmtDate(i.submittedAt) + ' · ' + fmtHM(i.submittedAt) + '</span></div>' + ico(open?'chevu':'chevd','cc') + '</button><div class="hd">'
      + (i.cantFixAt ? '<div class="cfl">Can\'t fix (' + fmtTime(i.cantFixAt) + '): ' + cfText(i) + '</div>' : '')
      + ((i.attempts&&i.attempts.length) ? '<div class="cfl">Packers said not fixed ×' + i.attempts.length + ' (last ' + fmtTime(i.attempts[i.attempts.length-1].at) + ')</div>' : '')
      + (i.escalatedAt ? '<div class="cfl">Escalated ' + fmtTime(i.escalatedAt) + (i.qaAt ? ' → QA ' + (i.qaDecision==='approved'?'APPROVED':'NOT APPROVED') + ' ' + fmtTime(i.qaAt) : ' – waiting for QA / Manager') + '</div>' : '')
      + '<div class="g"><div>Sent<b>' + fmtTime(i.submittedAt) + '</b></div>'
      + '<div>Op. confirmed<b>' + fmtTime(i.ackAt) + '</b><i>response ' + resp + '</i></div>'
      + '<div>Op. fixed<b>' + fmtTime(i.opResolvedAt) + '</b><i>repair ' + (i.opResolvedAt&&i.ackAt?fmtDur(i.opResolvedAt-i.ackAt):'—') + '</i></div>'
      + '<div>Packers OK<b>' + fmtTime(i.resolvedAt) + '</b><i>total ' + fix + '</i></div></div></div></div>';
  };
  const counts = arr => { const r = arr.filter(i => i.color==='red').length, y = arr.length - r; return '<small>' + arr.length + (arr.length===1?' issue':' issues') + (r?' · <b class="cr">' + r + ' red</b>':'') + (y?' · <b class="cy">' + y + ' yellow</b>':'') + '</small>'; };
  const gh = (key, cls, label, arr, open) => '<button class="gh ' + cls + '" data-act="gtoggle" data-g="' + key + '" data-open="' + (open?1:0) + '"><span class="gl">' + label + '</span>' + counts(arr) + ico(open?'chevu':'chevd','cc') + '</button>';
  let body;
  if (!all.length) body = '<div class="card empty">No issues logged yet</div>';
  else if (filtering) {
    body = '<div class="resh">' + list.length + (list.length===1?' result':' results') + '</div>' + (list.length ? list.map(card).join('') : '<div class="card empty">Nothing matches these filters</div>');
  } else {
    const now = new Date(); const cy = now.getFullYear(), cm = now.getMonth();
    const years = {};
    all.forEach(i => { const d = new Date(i.submittedAt); const y = d.getFullYear(), m = d.getMonth(); ((years[y] = years[y] || {})[m] = years[y][m] || []).push(i); });
    const g = view.g || {};
    body = Object.keys(years).sort((a,b) => b - a).map(y => {
      const yArr = [].concat(...Object.values(years[y]));
      const yKey = 'y' + y; const yOpen = yKey in g ? g[yKey] : Number(y) === cy;
      const months = !yOpen ? '' : Object.keys(years[y]).sort((a,b) => b - a).map(m => {
        const mArr = years[y][m]; const mKey = 'm' + y + '-' + m;
        const mOpen = mKey in g ? g[mKey] : (Number(y) === cy && Number(m) === cm);
        const label = new Date(Number(y), Number(m), 1).toLocaleDateString('en-US', {month:'long'});
        return '<div class="grp">' + gh(mKey, 'mo', label, mArr, mOpen) + (mOpen ? '<div class="gcards">' + mArr.map(card).join('') + '</div>' : '') + '</div>';
      }).join('');
      return '<div class="grp yrg">' + gh(yKey, 'yr', y, yArr, yOpen) + (yOpen ? '<div class="gmonths">' + months + '</div>' : '') + '</div>';
    }).join('');
  }
  const typeOpts = '<option value="all">All issues</option>' + Object.keys(TYPES).map(k => '<option value="' + k + '"' + (f.t===k?' selected':'') + '>' + TYPES[k].t[0] + '</option>').join('');
  return '<div class="head">' + backBtn('home','',true) + '<div class="title">Issue Log <span class="vtag">v' + APP_VERSION + '</span></div></div>'
    + '<div class="card fbar"><div class="frow"><div class="seg">'
    + ['all','red','yellow'].map(u => '<button class="' + (f.u===u?'on ':'') + u + '" data-act="fu" data-v="' + u + '">' + (u==='all'?'All':u==='red'?'Red':'Yellow') + '</button>').join('')
    + '</div><select class="fsel" data-f="t" aria-label="Issue type">' + typeOpts + '</select>'
    + '<input class="fdate" type="date" data-f="d" value="' + f.d + '" aria-label="Date">'
    + (filtering ? '<button class="pill" data-act="fclear">' + ico('x','cc') + 'Clear filters</button>' : '') + '</div></div>'
    + '<div class="hbar"><button class="pill" data-act="csv">' + ico('dl','cc') + 'Download CSV backup</button></div>'
    + '<div class="hist">' + body + '</div>';
}

function exportCsv(){
  const q = v => `"${String(v).replace(/"/g,'""')}"`;

  [...issues].sort((a,b)=>a.submittedAt-b.submittedAt).forEach(i => rows.push([
    TYPES[i.type].t[0], i.color, i.cancelledAt?'cancelled':i.qaAt?'qa-'+i.qaDecision:i.resolvedAt?'resolved':i.escalatedAt?'escalated':'open',
    iso(i.submittedAt), iso(i.ackAt), iso(i.cantFixAt), i.cantFixReason ? REASONS[i.cantFixReason].t[0] : '', i.cantFixNote || '',
    iso(i.opResolvedAt), iso(i.resolvedAt), iso(i.escalatedAt), i.qaDecision || '', iso(i.qaAt), (i.attempts||[]).length, (i.attempts&&i.attempts.length)?iso(i.attempts[i.attempts.length-1].at):'',
    i.ackAt ? ((i.ackAt-i.submittedAt)/60000).toFixed(1) : '',

  return m ? m[1] : null;

    const latest = (await fetchLatest()) || APP_VERSION;
    try { sessionStorage.setItem('gluer.target', latest); sessionStorage.setItem('gluer.tries', '0'); } catch(e){}
    try { if ('caches' in window) (await caches.keys()).forEach(k => caches.delete(k)); } catch(e){}
    try { if (navigator.serviceWorker) (await navigator.serviceWorker.getRegistrations()).forEach(x => x.unregister()); } catch(e){}

/* ---------- realtime sync between tablets ---------- */
/* Every change is sent to a small hub (Cloudflare Worker) the moment it happens; every other tablet in the same room
   receives it within a fraction of a second. The app still works with no connection and catches up when it returns. */
const DEFAULT_SYNC_URL = 'wss://gluer-issue-sync.anthony-mancino2.workers.dev/ws';
Sync = (() => {
  const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  let cid = get('gluerIssueAlert.cid'); if (!cid) { cid = Math.random().toString(36).slice(2, 8); put('gluerIssueAlert.cid', cid); }
  const qs = new URLSearchParams(location.search);
  if (qs.get('sync')) put('gluer.syncurl', qs.get('sync'));
  if (qs.get('room')) put('gluer.room', qs.get('room'));
  const cfg = () => ({ url: get('gluer.syncurl') || DEFAULT_SYNC_URL, room: get('gluer.room') || '', peer: get('gluer.peer') || '' });
  let ws = null, state = 'off', online = 0, tries = 0, timer = null, pingT = null, pongT = null, dirty = false, offset = 0, helloAt = 0, ready = false;
  const realNow = Date.now.bind(Date);
  Date.now = () => realNow() + offset;                       // keep every tablet on the hub's clock so timestamps agree
  const strip = i => { const { v, vc, ...r } = i; return JSON.stringify(r); };
  const snap = {}; issues.forEach(i => { snap[i.id] = strip(i); });
  /* only changes the hub has not confirmed are re-sent, and only changes since the last server number are fetched */
  const pend = () => { try { return JSON.parse(get('gluer.pending') || 'null'); } catch (e) { return null; } };
  const setPend = p => put('gluer.pending', JSON.stringify(p));
  const markAll = () => { const p = {}; issues.forEach(i => { p[i.id] = i.v || 0; }); setPend(p); };
  if (pend() === null) markAll();
  const seqKey = () => 'gluer.seq.' + (get('gluer.room') || '');
  const getSeq = () => Number(get(seqKey())) || 0;
  const setSeq = n => { if (n != null && n > getSeq()) put(seqKey(), String(n)); };
  const clearAcked = a => { if (!a) return; const p = pend() || {}; let ch = false; for (const id in a) if (id in p && p[id] <= a[id]) { delete p[id]; ch = true; } if (ch) setPend(p); };
  const newer = (a, b) => (a.v || 0) > (b.v || 0) || ((a.v || 0) === (b.v || 0) && String(a.vc || '') > String(b.vc || ''));
  const persist = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(issues)); } catch (e) {} };
  const sendRaw = s => { if (ws && ws.readyState === 1) { try { ws.send(s); return true; } catch (e) {} } return false; };
  const send = o => sendRaw(JSON.stringify(o));
  const label = () => !cfg().room ? 'LINK' : state === 'on' ? String(online) : state === 'wait' ? '…' : 'OFF';
  const status = () => !cfg().room ? 'Not linked to another tablet yet.' : state === 'on' ? (online >= 2
      ? pk(['Connected · ' + online + ' connections online', 'Conectado · ' + online + ' conexiones en línea', 'ချိတ်ဆက်မှု ' + online + ' ခု အွန်လိုင်း'])
      : pk(['This group is saved. Open the app on another device, or choose ADD DEVICE to invite it without replacing this group.', 'Este grupo está guardado. Abra la app en otro dispositivo o use AÑADIR DISPOSITIVO para invitarlo sin reemplazar el grupo.', 'ဤအဖွဲ့ကို သိမ်းထားသည်။ အခြားစက်တွင် အက်ပ်ဖွင့်ပါ၊ သို့မဟုတ် ADD DEVICE ကို နှိပ်ပါ။']))
    : state === 'wait' ? 'Connecting…' : 'Offline. Changes are saved here and will sync when the connection returns.';
  function ui() {
    document.querySelectorAll('.sync').forEach(b => { b.dataset.s = (state === 'on' && online < 2) ? 'alone' : state; const t = b.querySelector('.stx'); if (t) t.textContent = label(); });
    const st = document.getElementById('syncstat'); if (st) st.textContent = status();
  }
  function afterSave() {
    const out = [];
    for (const i of issues) { const s = strip(i); if (snap[i.id] !== s) { i.v = (i.v || 0) + 1; i.vc = cid; snap[i.id] = s; out.push(i); } }
    if (out.length) { persist(); const p = pend() || {}; out.forEach(i => { p[i.id] = i.v; }); setPend(p); send({ t: 'up', issues: out }); }
  }
  function soft() {
    if (document.querySelector('.modal .sheet') || !['home', 'detail', 'history'].includes(view.name)) { dirty = true; return; }
    dirty = false;
    const sc = document.querySelector('.hist'), top = sc ? sc.scrollTop : 0;
    render();
    const s2 = document.querySelector('.hist'); if (s2) s2.scrollTop = top;
  }
  function merge(list) {
    let changed = false;
    for (const r of list) {
      if (!r || !r.id) continue;
      const l = issues.find(x => x.id === r.id);
      if (!l) { issues.push(r); snap[r.id] = strip(r); changed = true; }
      else if (newer(r, l)) { Object.keys(l).forEach(k => delete l[k]); Object.assign(l, r); snap[r.id] = strip(r); changed = true; }
    }
    if (changed) {
      persist(); soft();
      // Hardware must follow synced issues even while Settings or a dialog delays rendering.
      if (typeof Light !== 'undefined' && Light) Light.apply();
    }
  }
  function cleanup() {
    clearInterval(pingT); clearTimeout(pongT);
    if (ws) { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; try { ws.close(); } catch (e) {} ws = null; }
    state = 'off'; online = 0; ready = false; ui();
  }
  function schedule() { clearTimeout(timer); timer = setTimeout(connect, Math.min(1000 * Math.pow(2, tries++), 10000)); }
  function connect() {
    clearTimeout(timer); if (ws) return;
    const c = cfg(); if (!c.room) { state = 'off'; ui(); return; } ready = false; state = 'wait'; ui();
    let sock;
    try { sock = new WebSocket(c.url + '?room=' + encodeURIComponent(c.room) + '&c=' + cid); } catch (e) { state = 'off'; ui(); schedule(); return; }
    ws = sock;
    sock.onopen = () => {
      tries = 0; state = 'on'; ui(); helloAt = realNow();
      const p = pend() || {};
      send({ t: 'hello', c: cid, since: getSeq(), issues: issues.filter(i => i.id in p) });
      clearInterval(pingT);
      pingT = setInterval(() => { if (sendRaw('ping')) { clearTimeout(pongT); pongT = setTimeout(() => { cleanup(); schedule(); }, 8000); } }, 20000);
    };
    sock.onmessage = ev => {
      if (ev.data === 'pong') { clearTimeout(pongT); return; }
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'snap' && m.done && m.now) { const rtt = realNow() - helloAt; offset = (m.now + rtt / 2) - realNow(); }
      if (m.n != null) { online = m.n; ui(); }
      if (m.t === 'snap' || m.t === 'up') merge(m.issues || []);

/* ---------- keyboard shortcuts (for using the app on a computer) ----------

KB = (() => {

  const SUGGEST = {

    'open-1': 'F1', 'open-2': 'F2', 'open-3': 'F3', 'open-4': 'F4', 'open-5': 'F5x',

    }
    else if (a === 'kbsuggestgo') { applySuggest(); closeModal(); rerender(); toastL(tk('Suggested keys added')); }
    else if (a === 'kbclearask') {
      if (!mapped()) { toastL(tk('No keys are set')); return; }
      askModal(['Remove every key?', '¿Quitar todas las teclas?', 'ခလုတ်အားလုံး ဖယ်ရှားမလား?'], ['KEEP', 'MANTENER', 'ထားမည်'], ['REMOVE ALL', 'QUITAR TODO', 'အားလုံးဖယ်မည်'], 'danger', 'kbclearall', '', 'Keyboard shortcuts');

    state: () => ({ on: st.on, hints: st.hints, map: st.map, cap }),

    sharedWith: id => { const t = st.map[id]; if (!t) return ''; const o = CMDS.filter(c => c.id !== id && st.map[c.id] === t).map(c => pk(c.tri)); return o.length > 2 ? o.slice(0, 2).join(', ') + '…' : o.join(', '); },
    nm: c => lang === 'en' ? c.n : `${pk(c.tri)}<i class="ken">${c.n}</i>`,
    label, act, hints, leave: () => { cap = null; }
  };
})();

/* ---------- alert light ----------
   The LED tower is switched by a Waveshare ESP32 relay board that connects out to the light service on the hub.
   The tablet works out what the light should do - exactly what the top-bar lamps do - and sends it to the service,
   which hands it to the board. Red flashing = new red issue, yellow = new yellow issue, blue = operator on it,
   blue flashing = back with the packers, red/blue alternating = escalated, green = all clear.
   Both tablets of a pair compute the same thing from the synced issues, so it does not matter which one is switched on. */
Light = (() => {
  const KEY = 'gluer.light';
  const DEF_MAP = { red: 1, yellow: 2, blue: 3, green: 4 };
  let st = { on: false, code: '', map: Object.assign({}, DEF_MAP) };
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) st = { on: !!s.on, code: String(s.code || ''), map: Object.assign({}, DEF_MAP, s.map || {}) }; } catch (e) {}
  let ws = null, tries = 0, retry = null, hbT = null, linkOk = false, devN = 0, testing = null, tt = null, last = '';
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const mkCode = () => Array.from(crypto.getRandomValues(new Uint8Array(9)), b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
  const chOf = k => st.map[k] ? [Number(st.map[k])] : [];
  const want = () => {
    if (testing) return testing;
    if (!st.on) return { c: 'off', m: 'steady', a: [], b: [] };
    const o = overall(), open = issues.filter(isOpen);
    const needPack = open.some(i => i.opResolvedAt || (i.cantFixAt && !isEsc(i)));
    return o === 'cop' ? { c: 'cop', m: 'alt', a: chOf('red'), b: chOf('blue') }
      : o === 'red' ? { c: 'red', m: 'flash', a: chOf('red'), b: [] }
      : o === 'yellow' ? { c: 'yellow', m: 'steady', a: chOf('yellow'), b: [] }
      : o === 'blue' ? { c: 'blue', m: needPack ? 'flash' : 'steady', a: chOf('blue'), b: [] }
      : { c: 'green', m: 'steady', a: chOf('green'), b: [] };
  };
  const send = o => { if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify(o)); return true; } catch (e) {} } return false; };
  const synced = () => !Sync || !Sync.cfg().room || Sync.ready();
  const push = (w, force = false) => (force || synced()) && send({ t: 'set', a: w.a, b: w.b, m: w.m });
  const statEl = () => { document.querySelectorAll('.lightlink').forEach(e => { e.textContent = linkText(); e.dataset.s = !st.on ? 'off' : !linkOk ? 'wait' : devN > 0 ? 'ok' : 'warn'; }); };
  const linkText = () => !st.on ? pk(['The light is OFF in this app.', 'La luz está APAGADA en esta app.', 'ဤအက်ပ်တွင် မီး ပိတ်ထားသည်။'])
    : !linkOk ? pk(['Connecting to the light service…', 'Conectando con el servicio de la luz…', 'မီးဝန်ဆောင်မှုသို့ ချိတ်ဆက်နေသည်…'])
    : devN > 0 ? pk(['Light controller connected ✓', 'Controlador de luz conectado ✓', 'မီးထိန်းကိရိယာ ချိတ်ဆက်ပြီး ✓'])
    : pk(['The light controller is NOT connected. Check its power, its Wi-Fi, and that its light code matches the code above.', 'El controlador de la luz NO está conectado. Revise su energía, su Wi-Fi y que su código coincida con el de arriba.', 'မီးထိန်းကိရိယာ မချိတ်ဆက်ရသေးပါ။ ၎င်း၏ ဓာတ်အား၊ Wi-Fi နှင့် မီးကုဒ်သည် အထက်ပါကုဒ်နှင့် တူမတူ စစ်ပါ။']);
  function close() {
    clearTimeout(retry); retry = null; clearInterval(hbT);
    if (ws) { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; try { ws.close(); } catch (e) {} ws = null; }
    linkOk = false; devN = 0;
  }
  function connect() {
    clearTimeout(retry); retry = null;
    if (ws || !st.on || !st.code) return;
    const base = (localStorage.getItem('gluer.syncurl') || DEFAULT_SYNC_URL).replace(/\/ws$/, '/light');
    let w; try { w = new WebSocket(base + '?code=' + encodeURIComponent(st.code.toLowerCase())); } catch (e) { retry = setTimeout(connect, 5000); return; }
    ws = w;
    w.onopen = () => {
      tries = 0; linkOk = true; statEl(); last = ''; apply();
      clearInterval(hbT); hbT = setInterval(() => send({ t: 'hb' }), 20000); send({ t: 'hb' });
    };
    w.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } if (m.t === 'dev') { devN = m.n || 0; statEl(); } };
    w.onclose = () => { if (ws !== w) return; ws = null; linkOk = false; devN = 0; clearInterval(hbT); statEl(); if (st.on) retry = setTimeout(connect, Math.min(1000 * Math.pow(2, tries++), 15000)); };
    w.onerror = () => {};
  }
  function apply() {
    const w = want(), key = w.c + ' ' + w.m;
    document.querySelectorAll('.lightprev').forEach(e => { e.dataset.l = key; });
    if (st.on && st.code && !ws && !retry) connect();
    if (key !== last) { if (push(w, !!testing) || !st.on) last = key; }
  }
  const rerender = () => { if (view.name === 'settings') { const sc = document.querySelector('.hist'); const top = sc ? sc.scrollTop : 0; render(); const s2 = document.querySelector('.hist'); if (s2) s2.scrollTop = top; } };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && st.on) { if (!ws) { tries = 0; connect(); } else send({ t: 'hb' }); } });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'lightcode') { const v = t.value.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 24); if (v.length >= 8) { st.code = v; persist(); close(); last = ''; apply(); } t.value = st.code.toUpperCase(); rerender(); }
    else if (t.dataset && t.dataset.lm) { st.map[t.dataset.lm] = Number(t.value) || 0; persist(); last = ''; apply(); }
  });
  return {
    state: () => ({ on: st.on, now: want(), connected: linkOk && devN > 0, code: st.code, map: st.map, linkOk, devN }),
    linkText,
    pairing: () => st.on && /^[a-z0-9]{8,24}$/.test(st.code) ? { on: true, code: st.code, map: Object.assign({}, st.map) } : null,
    acceptPairing: s => {
      if (!s || s.on !== true || typeof s.code !== 'string' || !/^[a-z0-9]{8,24}$/.test(s.code)) return;
      const map = {};
      for (const colour of Object.keys(DEF_MAP)) {
        const ch = s.map && s.map[colour];
        if (!Number.isInteger(ch) || ch < 0 || ch > 6) return;
        map[colour] = ch;
      }
      close(); st = { on: true, code: s.code, map }; persist(); last = '';
      // Sync.connect() first obtains the group's current issues before publishing a light state.
    },
    toggle: () => { st.on = !st.on; if (st.on && !st.code) st.code = mkCode(); persist(); if (st.on) { last = ''; tries = 0; apply(); } else { push({ a: [], b: [], m: 'steady' }, true); setTimeout(close, 400); last = ''; } rerender(); },
    newCode: () => { st.code = mkCode(); persist(); close(); last = ''; apply(); rerender(); },
    test: c => {
      clearTimeout(tt);
      testing = c === 'off' ? null : { c, m: c === 'red' ? 'flash' : c === 'cop' ? 'alt' : 'steady', a: chOf(c === 'cop' ? 'red' : c), b: c === 'cop' ? chOf('blue') : [] };
      last = ''; apply(); rerender();
      tt = setTimeout(() => { testing = null; last = ''; apply(); rerender(); }, 6000);
    },
    relay: ch => { if (!st.code) { st.code = mkCode(); persist(); } if (!ws) connect(); send({ t: 'relay', ch: Number(ch), on: true, ms: 3000 }); },
    apply
  };
})();

const LIGHT_NAMES = {
  'off steady': ['OFF','APAGADA','ပိတ်ထားသည်'],
  'green steady': ['GREEN – all clear','VERDE – todo bien','အစိမ်း – အားလုံးကောင်း'],
  'red flash': ['RED, flashing – new red issue','ROJO parpadeando – problema rojo nuevo','အနီ မှိတ်တုတ် – အနီပြဿနာအသစ်'],
  'yellow steady': ['YELLOW – new yellow issue','AMARILLO – problema amarillo nuevo','အဝါ – အဝါပြဿနာအသစ်'],
  'blue steady': ['BLUE – operator is on it','AZUL – el operador está en ello','အပြာ – အော်ပရေတာ လုပ်ဆောင်နေသည်'],
  'blue flash': ['BLUE, flashing – back with the packers','AZUL parpadeando – de vuelta con los empacadores','အပြာ မှိတ်တုတ် – ထုပ်ပိုးသူများထံ ပြန်ရောက်'],
  'cop alt': ['RED / BLUE alternating – escalated','ROJO / AZUL alternando – escalado','အနီ / အပြာ ပြောင်းလှည့် – တင်ပြပြီး']
};
function lightCard(){
  const s = Light.state(), key = s.now.c + ' ' + s.now.m;
  const tip = ['When ON, the light copies the lamps in the top bar: red flashing for a new red issue, yellow for a new yellow issue, blue when the operator is on it, blue flashing when it is back with the packers, red/blue alternating when escalated, and green when all is clear. If the light stops working, switch to two tablets (one for packers, one for the operator).',
    'Si está ACTIVADA, la luz copia las luces de la barra superior: rojo parpadeante para un problema rojo nuevo, amarillo para uno amarillo nuevo, azul cuando el operador está en ello, azul parpadeante cuando vuelve a los empacadores, rojo/azul alternando cuando se escala, y verde cuando todo está bien. Si la luz falla, use dos tablets (empacadores y operador).',
    'ဖွင့်ထားလျှင် မီးသည် အပေါ်ဘားရှိ မီးများအတိုင်း လုပ်ဆောင်သည် - အနီပြဿနာအသစ်အတွက် အနီမှိတ်တုတ်၊ အဝါပြဿနာအသစ်အတွက် အဝါ၊ အော်ပရေတာ လုပ်ဆောင်နေစဉ် အပြာ၊ ထုပ်ပိုးသူများထံ ပြန်ရောက်လျှင် အပြာမှိတ်တုတ်၊ တင်ပြပြီးလျှင် အနီ/အပြာ ပြောင်းလှည့်၊ အားလုံးကောင်းလျှင် အစိမ်း။ မီးမကောင်းလျှင် တက်ဘလက်နှစ်လုံး (ထုပ်ပိုးသူနှင့် အော်ပရေတာ) သုံးပါ။'];
  const nm = LIGHT_NAMES[key] || LIGHT_NAMES['off steady'];
  const LB = { red:['Test red','Probar rojo','အနီ စမ်းမည်'], yellow:['Test yellow','Probar amarillo','အဝါ စမ်းမည်'], blue:['Test blue','Probar azul','အပြာ စမ်းမည်'], green:['Test green','Probar verde','အစိမ်း စမ်းမည်'], cop:['Test escalated','Probar escalado','တင်ပြပြီး စမ်းမည်'], off:['Stop test','Detener prueba','စမ်းသပ်မှု ရပ်မည်'] };
  const onoff = s.on ? ['ON','ACTIVADA','ဖွင့်'] : ['OFF','APAGADA','ပိတ်'];
  const COL = { red:['Red','Rojo','အနီ'], yellow:['Yellow','Amarillo','အဝါ'], blue:['Blue','Azul','အပြာ'], green:['Green','Verde','အစိမ်း'] };
  const sel = k => `<label class="lmsel"><span>${pk(COL[k])}</span><select class="fsel" data-lm="${k}"><option value="0">—</option>${[1,2,3,4,5,6].map(n => `<option value="${n}" ${Number(s.map[k]) === n ? 'selected' : ''}>CH${n}</option>`).join('')}</select></label>`;
  const idHelp = ['Identify the relays: tap a channel, it switches on for 3 seconds. Look at which colour lights up, then set the colours above.', 'Identificar los relés: toque un canal, se enciende 3 segundos. Mire qué color se enciende y luego ajuste los colores de arriba.', 'ရီလေးများ သိရန် - ချန်နယ်တစ်ခုကို နှိပ်ပါ၊ ၃ စက္ကန့် ဖွင့်မည်။ မည်သည့်အရောင် လင်းသည်ကို ကြည့်ပြီး အထက်ရှိ အရောင်များကို သတ်မှတ်ပါ။'];
  const codeHelp = ['Light code – type this same code into the relay board once:', 'Código de la luz – escriba este mismo código en la placa de relés una sola vez:', 'မီးကုဒ် – ဤကုဒ်ကို ရီလေးဘုတ်တွင် တစ်ကြိမ်ထည့်ပါ -'];
  return `<div class="card lightcard">
    <div class="khead">${lg(['Alert light','Luz de alerta','သတိပေးမီး'],'inline')}</div>
    <div class="ktip"><p>${pk(tip)}</p>${lang==='en'?'':`<p class="ken">${tip[0]}</p>`}</div>
    <div class="lightrow"><span class="lightprev" data-l="${key}"></span><div class="lighttxt"><b>${pk(nm)}</b>${lang==='en'?'':`<i class="ken">${nm[0]}</i>`}<small class="lightlink" data-s="${!s.on?'off':!s.linkOk?'wait':s.devN>0?'ok':'warn'}">${Light.linkText()}</small></div></div>
    <div class="kbar"><button class="pill ${s.on?'teal':''}" data-act="lighttoggle">${bx('Alert light: ' + onoff[0], pk(['Alert light','Luz de alerta','သတိပေးမီး']) + ': ' + pk(onoff))}</button></div>
    ${s.on ? `<div class="lightcode"><div class="rlab">${pk(codeHelp)}</div><div class="lcrow"><input id="lightcode" class="rin" value="${esc2(s.code.toUpperCase())}" maxlength="24" autocomplete="off" spellcheck="false" autocapitalize="characters"><button class="pill" data-act="lightnew">${bx('New code', pk(['New code','Código nuevo','ကုဒ်အသစ်']))}</button></div></div>
    <div class="lmrow">${['red','yellow','blue','green'].map(sel).join('')}</div>
    <div class="ktip"><p>${pk(idHelp)}</p>${lang==='en'?'':`<p class="ken">${idHelp[0]}</p>`}</div>
    <div class="kbar">${[1,2,3,4,5,6].map(n => `<button class="pill" data-act="lightrelay" data-ch="${n}">CH${n}</button>`).join('')}</div>` : ''}
    <div class="kbar">${Object.keys(LB).map(c => `<button class="pill ${c==='off'?'ghost':''}" data-act="lighttest" data-c="${c}">${bx(LB[c][0], pk(LB[c]))}</button>`).join('')}</div>
  </div>`;
}
const esc2 = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* one shared tablet: after the operator answers, a big blue message tells them to hand the tablet back */
function handoffBack(){
  modal(`<div class="handwrap">${ico('arrow','cc')}${lg(['GIVE THE TABLET BACK TO THE PACKERS','DEVUELVA LA TABLET A LOS EMPACADORES','တက်ဘလက်ကို ထုပ်ပိုးသူများထံ ပြန်ပေးပါ'],'xl c')}</div>
    <div class="mrow one"><div class="cell"><button class="bb mbtn f-blue" data-act="closemodal"><span class="bi">${lg(['PACKERS HAVE IT','LOS EMPACADORES LA TIENEN','ထုပ်ပိုးသူများ ရပြီ'],'c')}</span></button></div></div>`);
  const sh = document.querySelector('#overlay .sheet'); if (sh) sh.classList.add('hand');
  modalRebuild = handoffBack;
}

/* keep the tablet screen awake */
let wl = null;
async function keepAwake(){ try { if (navigator.wakeLock && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch(e){} }
document.addEventListener('pointerdown', keepAwake, {passive:true});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

/* ---------- version tag + automatic "new version available" check ---------- */
let latestSeen = null;
function renderVer(){
  const nw = latestSeen && latestSeen !== APP_VERSION;
  $('#verui').innerHTML = nw
    ? `<button class="vertag new" data-act="update">v${APP_VERSION} · ${pk(['Update available','Actualización disponible','အပ်ဒိတ် ရနိုင်ပြီ'])}: v${latestSeen}</button>`
    : `<span class="vertag">v${APP_VERSION}</span>`;
}
async function checkLatest(){ try { latestSeen = await fetchLatest(); } catch(e){} renderVer(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkLatest(); });
setInterval(checkLatest, 300000);

/* after an Update, if the page that loaded is still older than what Update found (a slow cache), try again */
(function(){
  let target = null, tries = 0;
  try { target = sessionStorage.getItem('gluer.target'); tries = Number(sessionStorage.getItem('gluer.tries')) || 0; } catch(e){}
  if (target && target !== APP_VERSION && tries < 2) {
    try { sessionStorage.setItem('gluer.tries', String(tries + 1)); } catch(e){}
    setTimeout(() => location.replace(location.pathname + '?v=' + Date.now() + 'r'), 700);
    return;
  }
  try { sessionStorage.removeItem('gluer.target'); sessionStorage.removeItem('gluer.tries'); } catch(e){}
})();

renderLang();
renderVer();
checkLatest();
render();
</script>
